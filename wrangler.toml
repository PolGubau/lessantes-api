name = "les-santes-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Public-facing config (non-secret)
[vars]
FESTIVAL_ID = "les-santes-2026"
API_VERSION = "v1"
DATA_LICENSE_URL = "https://creativecommons.org/licenses/by/4.0/"

# Secrets (set via `wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY


# Custom route. Requires:
#   1. polgubau.com zone exists in your Cloudflare account
#   2. A DNS record for api.lessantes (CNAME, proxied) in that zone
[[routes]]
pattern = "api.lessantes.polgubau.com/*"
zone_name = "polgubau.com"


# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
